services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:attendance_dev_only@db:5432/attendance
      STORAGE_ROOT: /app/data
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db:
        condition: service_healthy
