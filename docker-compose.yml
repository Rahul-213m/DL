services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@db:5432/attendance
      STORAGE_ROOT: /app/data
      ENVIRONMENT: production
      API_KEY: ${API_KEY:?Set API_KEY to a long random secret in the deployment environment}
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db:
        condition: service_healthy
