[alembic]
# Canonical migration directory. Historically this was migrations_alembic/ and
# the old stub lived in migrations/; both were consolidated here. See
# archive/legacy_migrations/ for the retired SQL stub.
script_location = alembic
prepend_sys_path = .

# NOTE: sqlalchemy.url is intentionally NOT set here. alembic/env.py reads it
# from app settings (DATABASE_URL / .env) so migrations always target the same
# database the application uses. Setting it here would let the two drift.

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
