# Separate from the cloud pytest configuration on purpose.
#
# The cloud suite runs on Python 3.13 with pytest 9; the edge suite runs on the
# ROS 2 Jazzy system Python 3.12 with pytest 7, which cannot read a
# pyproject.toml declaring minversion = 8.0. Sharing one config made every
# edge test uncollectable.
[pytest]
testpaths = src
addopts = -ra -p no:cacheprovider
markers =
    requires_ros: needs a sourced ROS 2 Jazzy environment
    slow: takes more than a few seconds
