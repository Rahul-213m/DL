# Run:  pip install pre-commit && pre-commit install
# CI runs the same hooks, so a local pass means a CI pass.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy app
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (unit + integration, no models)
        entry: .venv/bin/python -m pytest tests -q -m "not requires_model and not requires_ros"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      # A weights file with the wrong hash is a supply-chain problem, not a
      # formatting problem. See docs/model_licensing.md.
      - id: model-weight-hashes
        name: verify recorded model weight SHA-256
        entry: .venv/bin/python scripts/verify_model_hashes.py
        language: system
        files: ^(models/|app/registry/)
        pass_filenames: false
